name: Build RafamonTV APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Signed APK with Android SDK Build-Tools
        run: |
          set -e
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)
          echo "Using BUILD_TOOLS=$BUILD_TOOLS and PLATFORM=$PLATFORM"
          mkdir -p build/gen build/obj build/apk
          "$BUILD_TOOLS/aapt" package -f -m \
            -J build/gen \
            -M app/src/main/AndroidManifest.xml \
            -S app/src/main/res \
            -A app/src/main/assets \
            -I "$PLATFORM/android.jar" \
            -F build/apk/unaligned.apk
          javac -source 1.8 -target 1.8 -bootclasspath "$PLATFORM/android.jar" \
            -classpath "$PLATFORM/android.jar" \
            -d build/obj \
            build/gen/com/rafamontv/app/R.java \
            app/src/main/java/com/rafamontv/app/MainActivity.java
          "$BUILD_TOOLS/d8" --lib "$PLATFORM/android.jar" \
            --output build/apk \
            build/obj/com/rafamontv/app/*.class
          cd build/apk
          zip -u unaligned.apk classes.dex
          "$BUILD_TOOLS/zipalign" -f 4 unaligned.apk aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=RafamonTV, OU=TV, O=Rafamon, L=SP, S=SP, C=BR"
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android --out RafamonTV.apk aligned.apk
          ls -lh RafamonTV.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RafamonTV-APK
          path: build/apk/RafamonTV.apk
